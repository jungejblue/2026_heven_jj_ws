# Spawn-plan settings used by qualifier integration preflight.
# Vehicle spawning is configured in qualifier_vehicle.json and owned by ROS Bridge.
# Qualifier/final trigger, route, mission and scoring data live in their suite YAML.
ego:
  spawn:
    mode: before_start_trigger
    back_distance_m: 8.0
    minimum_trigger_clearance_m: 2.0
    z_offset: 0.5
